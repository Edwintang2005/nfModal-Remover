<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <!-- Static copy of popup.html in its "on" state, styled by the real popup.css -->
  <link rel="stylesheet" href="../../NF%20Modal%20Remover%20Extension/Resources/popup.css">
  <style>
    /* Force the light palette regardless of the rendering machine's appearance */
    :root { --bg:#ffffff; --fg:#1d1d1f; --muted:#6e6e73; --line:#e5e5ea; --field:#f2f2f7; --accent:#0a84ff; --danger:#d70015; color-scheme: light; }
  </style>
</head>
<body>
  <header><h1>NF Modal Remover</h1></header>

  <section id="current">
    <div class="current-text">
      <div class="label">This site</div>
      <div class="host">news.example.com</div>
    </div>
    <label class="switch"><input type="checkbox" checked><span class="slider"></span></label>
  </section>

  <section>
    <div class="label">Active on</div>
    <ul>
      <li><span>forum.example.net</span><button>×</button></li>
      <li><span>news.example.com</span><button>×</button></li>
      <li><span>recipes.example.org</span><button>×</button></li>
    </ul>
    <form onsubmit="return false">
      <input type="text" placeholder="example.com">
      <button type="submit">Add</button>
    </form>
  </section>
</body>
</html>
